<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>TajCrash · Поддержка</title><style>body{background:#091727;color:#e9f9ff;font:16px system-ui;margin:0}main{max-width:650px;margin:auto;padding:22px}.card{background:#142b42;border:1px solid #33526a;border-radius:18px;padding:18px;margin:16px 0}input,select,textarea{box-sizing:border-box;width:100%;margin:8px 0;padding:12px;border-radius:10px;background:#091727;border:1px solid #48647c;color:white;font:inherit}button{background:#3ee1ad;color:#08221c;border:0;border-radius:11px;padding:12px 18px;font-weight:800;margin:6px 0}small,p{color:#adc4d5}.msg{padding:12px;margin:8px 0;background:#0a1e32;border-radius:12px;white-space:pre-wrap}h1{font-size:24px}#status{color:#ffcc86}</style></head><body><main><h1>💬 TajCrash · Поддержка</h1><p>Общение с администрацией и заявки только на виртуальные игровые средства.</p><p id="status"></p><div class="card"><h2>🏦 Заявка</h2><select id="kind"><option value="deposit">Виртуальное пополнение</option><option value="withdrawal">Виртуальное списание («вывод»)</option></select><select id="currency"><option>TJS</option><option>RUB</option><option>KZT</option><option>USD</option></select><input id="amount" inputmode="decimal" placeholder="Сумма, например 25.50"><textarea id="note" placeholder="Комментарий" maxlength="300"></textarea><button id="request">Отправить заявку</button><button id="history">История заявок</button><div id="requests"></div></div><div class="card"><h2>💬 Чат поддержки</h2><button id="refresh">Обновить сообщения</button><div id="messages"></div><textarea id="message" maxlength="2000" placeholder="Напиши сообщение..."></textarea><button id="send">Отправить</button></div></main><script>(()=>{'use strict';const api='https://tajcrash-api.onrender.com',tg=window.Telegram?.WebApp;let token='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const status=s=>$('status').textContent=s;async function call(path,opts={}){const r=await fetch(api+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка сервера');return d}async function login(){try{if(!tg?.initData)throw Error('Открой страницу внутри Telegram');tg.ready();const r=await fetch(api+'/auth/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});if(!r.ok)throw Error('Ошибка входа Telegram');token=(await r.json()).access_token;status('✓ Вход выполнен');await Promise.all([history(),refresh()])}catch(e){status(e.message)}}async function history(){try{const d=await call('/virtual/requests');$('requests').innerHTML=d.requests.map(x=>'<div class="msg">#'+x.id+' · '+(x.kind==='deposit'?'Пополнение':'Списание')+' · '+(x.amount_cents/100).toFixed(2)+' '+esc(x.currency)+'<br>'+esc(x.status)+'</div>').join('')||'<p>Заявок пока нет</p>'}catch(e){status(e.message)}}async function refresh(){try{const d=await call('/support/messages');$('messages').innerHTML=d.messages.map(x=>'<div class="msg"><small>'+(x.is_admin?'🛡 Поддержка':'👤 Вы')+'</small><br>'+esc(x.message)+'</div>').join('')||'<p>Сообщений пока нет</p>'}catch(e){status(e.message)}}$('request').onclick=async()=>{try{const s=$('amount').value.trim().replace(',','.');if(!/^\d{1,7}(\.\d{1,2})?$/.test(s))throw Error('Введите корректную сумму');const [whole,frac='']=s.split('.');const amount_cents=Number(whole)*100+Number((frac+'00').slice(0,2));await call('/virtual/requests',{method:'POST',body:JSON.stringify({kind:$('kind').value,currency:$('currency').value,amount_cents,note:$('note').value})});status('✓ Заявка отправлена администратору');$('amount').value='';await history()}catch(e){status(e.message)}};$('send').onclick=async()=>{try{const message=$('message').value.trim();if(!message)throw Error('Напиши сообщение');await call('/support/messages',{method:'POST',body:JSON.stringify({message})});$('message').value='';status('✓ Сообщение отправлено');await refresh()}catch(e){status(e.message)}};$('history').onclick=history;$('refresh').onclick=refresh;login()})();</script></body></html>
